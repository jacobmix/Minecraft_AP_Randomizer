name: Create New Release

concurrency:
  group: release-${{ github.event.inputs.branch_type }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      branch_type:
        description: "Normal or Dig"
        required: true
        type: choice
        options:
          - jar
          - jar_dig

      replace_existing:
        description: "Only update Jar. Update latest relevent release. Replacing latest relevant version.json URL instead of creating new version"
        required: false
        default: false
        type: boolean

      category:
        description: "minecraft_versions.json category"
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - old

      apworld_version_override:
        description: "Optional apworld version override (example: 0.1.5). If empty, auto-increments 0.0.x."
        required: false

      forge_override:
        description: "Optional forge override (example: 1.19.4-45.3.15)."
        required: false

      java_override:
        description: "Optional java override (example: 17)."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:

    ############################################################
    # Checkout master (controller branch)
    ############################################################

    - uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0

    - run: sudo apt-get update && sudo apt-get install jq -y

    ############################################################
    # Determine branch logic
    ############################################################

    - name: Determine branch variables
      id: vars
      run: |
        if [ "${{ github.event.inputs.branch_type }}" = "jar_dig" ]; then
          echo "JAR_BRANCH=jar_dig" >> $GITHUB_OUTPUT
          echo "APWORLD_BRANCH=apworld_dig" >> $GITHUB_OUTPUT
          echo "APWORLD_SUBFOLDER=apworlddig" >> $GITHUB_OUTPUT
          echo "TITLE_PREFIX=Dig apworld" >> $GITHUB_OUTPUT
          echo "TAG_SUFFIX=_dig" >> $GITHUB_OUTPUT
        else
          echo "JAR_BRANCH=jar" >> $GITHUB_OUTPUT
          echo "APWORLD_BRANCH=apworld" >> $GITHUB_OUTPUT
          echo "APWORLD_SUBFOLDER=apworld" >> $GITHUB_OUTPUT
          echo "TITLE_PREFIX=Main apworld" >> $GITHUB_OUTPUT
          echo "TAG_SUFFIX=_hotfix" >> $GITHUB_OUTPUT
        fi

    ############################################################
    # Determine next jar version integer
    ############################################################

    - name: Determine next jar version
      id: jarver
      run: |
        if [ "${{ github.event.inputs.replace_existing }}" = "true" ]; then
          # reuse latest version instead of incrementing
          if [ "${{ github.event.inputs.branch_type }}" = "jar_dig" ]; then
            SELECTOR='select(.url | test("dig"; "i"))'
          else
            SELECTOR='select(.url | test("dig"; "i") | not)'
          fi

          VERSION=$(jq -r "
            [.release[], .beta[], .old[]]
            | map($SELECTOR)
            | first
            | .version
          " versions/minecraft_versions.json)
        else
          VERSION=$(jq '[.release[], .beta[], .old[]] | max_by(.version).version + 1' versions/minecraft_versions.json)
        fi

        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

    ############################################################
    # Determine forge + java
    ############################################################

    - name: Determine forge + java
      id: forge
      run: |
        FILE=versions/minecraft_versions.json
    
        # determine selector based on branch type
        if [ "${{ github.event.inputs.branch_type }}" = "jar_dig" ]; then
          SELECTOR='select(.url | test("dig"; "i"))'
        else
          SELECTOR='select(.url | test("dig"; "i") | not)'
        fi
    
        # get matching entry once
        MATCH=$(jq -r "
          [.release[], .beta[], .old[]]
          | map($SELECTOR)
          | first
        " $FILE)
    
        # forge override or from match
        if [ -n "${{ github.event.inputs.forge_override }}" ]; then
          FORGE="${{ github.event.inputs.forge_override }}"
        else
          FORGE=$(echo "$MATCH" | jq -r '.forge')
        fi
    
        # java override or from match
        if [ -n "${{ github.event.inputs.java_override }}" ]; then
          JAVA="${{ github.event.inputs.java_override }}"
        else
          JAVA=$(echo "$MATCH" | jq -r '.java')
        fi
    
        MC_VERSION=$(echo "$FORGE" | cut -d- -f1)
    
        echo "FORGE=$FORGE" >> $GITHUB_OUTPUT
        echo "JAVA=$JAVA" >> $GITHUB_OUTPUT
        echo "MC_VERSION=$MC_VERSION" >> $GITHUB_OUTPUT

    ############################################################
    # === UPDATE JAR BRANCH ===
    ############################################################

    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.vars.outputs.JAR_BRANCH }}
        path: jar

    - name: Update APRandomizer.java version
      if: github.event.inputs.replace_existing != 'true'
      run: |
        FILE=$(find jar -name APRandomizer.java)
        sed -i "s/this.add([0-9]\+)/this.add(${{ steps.jarver.outputs.VERSION }})/" "$FILE"

    - name: Commit jar branch
      if: github.event.inputs.replace_existing != 'true'
      run: |
        cd jar
        git config user.name github-actions
        git config user.email github-actions@github.com
        git commit -am "Release version ${{ steps.jarver.outputs.VERSION }}"
        git push origin HEAD:${{ steps.vars.outputs.JAR_BRANCH }}

    ############################################################
    # === UPDATE APWORLD BRANCH ===
    ############################################################

    - uses: actions/checkout@v4
      with:
        ref: ${{ steps.vars.outputs.APWORLD_BRANCH }}
        path: apworld

    - name: Determine world_version
      id: apworldver
      run: |
        FILE=$(find apworld -name archipelago.json)
        CURRENT=$(jq -r '.world_version' "$FILE")

        if [ "${{ github.event.inputs.replace_existing }}" = "true" ]; then
          NEW_VERSION="$CURRENT"
        elif [ -n "${{ github.event.inputs.apworld_version_override }}" ]; then
          NEW_VERSION="${{ github.event.inputs.apworld_version_override }}"
        else
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        fi

        if [ "${{ github.event.inputs.replace_existing }}" != "true" ]; then
          jq ".world_version = \"$NEW_VERSION\"" "$FILE" > tmp.json
          mv tmp.json "$FILE"
        fi

        echo "CURRENT_VERSION=$CURRENT" >> $GITHUB_OUTPUT
        echo "APWORLD_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

    - name: Determine jar patch version
      id: jarpatch
      run: |
        VERSION="${{ steps.apworldver.outputs.APWORLD_VERSION }}"
        TAG="${VERSION}${{ steps.vars.outputs.TAG_SUFFIX }}"
    
        if [ "${{ github.event.inputs.replace_existing }}" != "true" ]; then
          echo "PATCH=0" >> $GITHUB_OUTPUT
          exit 0
        fi
    
        # list existing assets for the release
        ASSETS=$(gh release view "$TAG" --json assets -q '.assets[].name' || echo "")
    
        MAX=-1
        
        for FILE in $ASSETS; do
          # match new format: 0.0.11.X.jar
          if [[ "$FILE" =~ ${VERSION}\.([0-9]+)\.jar ]]; then
            NUM="${BASH_REMATCH[1]}"
            if [ "$NUM" -gt "$MAX" ]; then
              MAX="$NUM"
            fi
        
          # match old format: 0.0.11.jar
          elif [[ "$FILE" =~ ${VERSION}\.jar ]]; then
            if [ "$MAX" -lt 0 ]; then
              MAX=0
            fi
          fi
        done
        
        PATCH=$((MAX + 1))
        echo "PATCH=$PATCH" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Update client_version in __init__.py
      if: github.event.inputs.replace_existing != 'true'
      run: |
        FILE=$(find apworld -name "__init__.py")
        sed -i "s/client_version = [0-9]\+/client_version = ${{ steps.jarver.outputs.VERSION }}/" "$FILE"

    - name: Commit apworld branch
      if: github.event.inputs.replace_existing != 'true'
      run: |
        cd apworld
        git config user.name github-actions
        git config user.email github-actions@github.com
        git commit -am "Release apworld ${{ steps.apworldver.outputs.APWORLD_VERSION }}"
        git push origin HEAD:${{ steps.vars.outputs.APWORLD_BRANCH }}

    ############################################################
    # Prevent duplicate tag (after version known)
    ############################################################

    - name: Check if tag already exists
      if: github.event.inputs.replace_existing != 'true'
      run: |
        TAG="${{ steps.apworldver.outputs.APWORLD_VERSION }}${{ steps.vars.outputs.TAG_SUFFIX }}"
        if git rev-parse "$TAG" >/dev/null 2>&1; then
          echo "Tag already exists: $TAG"
          exit 1
        fi

    ############################################################
    # Determine previous tag for proper compare
    ############################################################

    - name: Get previous tag
      id: prevtag
      run: |
        LAST_TAG=$(git tag --sort=-creatordate | head -n 1 || echo "")
        echo "LAST_TAG=$LAST_TAG" >> $GITHUB_OUTPUT

    - name: Build compare URL
      id: compare
      run: |
        NEW_TAG="${{ steps.apworldver.outputs.APWORLD_VERSION }}${{ steps.vars.outputs.TAG_SUFFIX }}"

        if [ -n "${{ steps.prevtag.outputs.LAST_TAG }}" ]; then
          URL="https://github.com/${{ github.repository }}/compare/${{ steps.prevtag.outputs.LAST_TAG }}...$NEW_TAG"
        else
          URL="Initial release"
        fi

        echo "COMPARE_URL=$URL" >> $GITHUB_OUTPUT

    ############################################################
    # Build jar
    ############################################################

    - name: Build jar
      run: |
        cd jar
        chmod +x gradlew
        ./gradlew build

    ############################################################
    # Build .apworld
    ############################################################

    - name: Prepare artifacts
      id: artifacts
      run: |
        mkdir release

        JAR=$(find jar/build/libs -name "*.jar" | head -n 1)
        NEW_JAR="aprandomizer-MC${{ steps.forge.outputs.MC_VERSION }}-${{ steps.apworldver.outputs.APWORLD_VERSION }}.${{ steps.jarpatch.outputs.PATCH }}.jar"
        cp "$JAR" "release/$NEW_JAR"

        cd apworld/${{ steps.vars.outputs.APWORLD_SUBFOLDER }}
        zip -r ../../release/temp.zip .
        cd ../../release

        APWORLD_FILE="minecraft${{ steps.vars.outputs.TAG_SUFFIX == '_dig' && '_dig' || '' }}.apworld"
        mv temp.zip "$APWORLD_FILE"

        echo "JAR=$NEW_JAR" >> $GITHUB_OUTPUT
        echo "APWORLD=$APWORLD_FILE" >> $GITHUB_OUTPUT

    ############################################################
    # Create GitHub Release
    ############################################################

    - name: Create GitHub Release
      if: github.event.inputs.replace_existing != 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.apworldver.outputs.APWORLD_VERSION }}${{ steps.vars.outputs.TAG_SUFFIX }}
        name: ${{ steps.vars.outputs.TITLE_PREFIX }} ${{ steps.apworldver.outputs.APWORLD_VERSION }} (MC${{ steps.forge.outputs.MC_VERSION }})
        body: |
          Instructions:
          https://github.com/jacobmix/Minecraft_AP_Randomizer/blob/master/README.md

          **Full Changelog**:
          ${{ steps.compare.outputs.COMPARE_URL }}

        files: |
          release/${{ steps.artifacts.outputs.JAR }}
          release/${{ steps.artifacts.outputs.APWORLD }}

    ############################################################
    # Replace existing release jar asset (replace mode)
    ############################################################

    - name: Replace existing release jar asset
      if: github.event.inputs.replace_existing == 'true'
      run: |
        TAG="${{ steps.apworldver.outputs.APWORLD_VERSION }}${{ steps.vars.outputs.TAG_SUFFIX }}"
        FILE="release/${{ steps.artifacts.outputs.JAR }}"

        gh release upload "$TAG" "$FILE"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        # gh release delete-asset "$TAG" "${{ steps.artifacts.outputs.APWORLD }}" --yes || true
        # gh release upload "$TAG" "release/${{ steps.artifacts.outputs.APWORLD }}" --clobber

    ############################################################
    # Update minecraft_versions.json
    ############################################################

    - name: Update minecraft_versions.json
      run: |
        URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.apworldver.outputs.APWORLD_VERSION }}${{ steps.vars.outputs.TAG_SUFFIX }}/${{ steps.artifacts.outputs.JAR }}"

        FILE=versions/minecraft_versions.json

        if [ "${{ github.event.inputs.replace_existing }}" = "true" ]; then

          if [ "${{ github.event.inputs.branch_type }}" = "jar_dig" ]; then
            SELECTOR='test("dig"; "i")'
          else
            SELECTOR='test("dig"; "i") | not'
          fi

          jq "
            (.release[], .beta[], .old[])
            |= if (.url | $SELECTOR)
               then .url = \"$URL\"
               else .
               end
          " $FILE > tmp.json

        else

          jq ".${{ github.event.inputs.category }} |= [{\"version\": ${{ steps.jarver.outputs.VERSION }}, \"java\": \"${{ steps.forge.outputs.JAVA }}\", \"forge\": \"${{ steps.forge.outputs.FORGE }}\", \"url\": \"$URL\"}] + ." $FILE > tmp.json

        fi

        mv tmp.json $FILE

        git config user.name github-actions
        git config user.email github-actions@github.com
        git commit -am "Update minecraft_versions.json"
        git push origin master
