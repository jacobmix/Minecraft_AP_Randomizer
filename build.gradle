buildscript {
    repositories {
        maven { url = 'https://files.minecraftforge.net/maven' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath 'org.parchmentmc:librarian:1.+'
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}
plugins {
    id 'com.github.johnrengelman.shadow' version "7.1.2"
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.parchmentmc.librarian.forgegradle'
apply plugin: 'org.spongepowered.mixin'
// Only edit below this line, the above code adds and enables the necessary things for Forge to be setup.
//apply plugin: 'eclipse'
apply plugin: 'maven-publish'


version = '0.1'
group = 'gg.archipelago.aprandomizer' // http://maven.apache.org/guides/mini/guide-naming-conventions.html
archivesBaseName = 'aprandomizer-MC1.19.4'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println('Java: ' + System.getProperty('java.version') + ' JVM: ' + System.getProperty('java.vm.version') + '(' + System.getProperty('java.vendor') + ') Arch: ' + System.getProperty('os.arch'))
minecraft {
    // The mappings can be changed at any time, and must be in the following format.
    // Channel:   Version:
    // snapshot   YYYYMMDD   Snapshot are built nightly.
    // stable     #          Stables are built at the discretion of the MCP team.
    // official   MCVersion  Official field/method names from Mojang mapping files
    //
    // You must be aware of the Mojang license when using the 'official' mappings.
    // See more information here: https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    //
    // Use non-default mappings at your own risk. they may not always work.
    // Simply re-run your setup task after changing the mappings to update your workspace.
    mappings channel: 'official', version: '1.19.4'
    //mappings channel: 'parchment', version: '2023.02.26-1.19.3'
    //mappings channel: 'parchment', version: '2022.03.13-1.18.2'
    // makeObfSourceJar = false // an Srg named sources jar is made by default. uncomment this to disable.

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed. 
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                aprandomizer {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed. 
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            mods {
                aprandomizer {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')

            // Recommended logging data for a userdev environment
            // The markers can be changed as needed. 
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            property 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            property 'forge.logging.console.level', 'debug'

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', 'aprandomizer', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')

            mods {
                aprandomizer {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, "aprandomizer.refmap.json"
    config 'aprandomizer.mixins.json'
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    shade
    compile.extendsFrom shade
    library
    implementation.extendsFrom library
    library.extendsFrom shade
    implementation.extendsFrom shade

}
minecraft.runs.configureEach {
    lazyToken('minecraft_classpath') {
        configurations.library.copyRecursive().resolve().collect { it.absolutePath }.join(File.pathSeparator)
    }
}

dependencies {
    // Specify the version of Minecraft to use, If this is any group other then 'net.minecraft' it is assumed
    // that the dep is a ForgeGradle 'patcher' dependency. And it's patches will be applied.
    // The userdev artifact is a special name and will get all sorts of transformations applied to it.
    minecraft 'net.minecraftforge:forge:1.19.4-45.0.43'

    // For more info...
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html


    shade 'io.github.archipelagomw:Java-Client:0.2.0'
    //shade 'org.apache.httpcomponents.core5:httpcore5-parent:5.3.6'
    //shade project(path: ':APClient')
    annotationProcessor 'org.spongepowered:mixin:0.8.4:processor'
}

shadowJar {
    dependencies {
        exclude(dependency('com.google.code.gson:gson'))
        exclude(dependency('org.slf4j:slf4j-api'))
    }
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    finalizedBy 'reobfShadowJar'
}

assemble.dependsOn shadowJar

reobf {
    shadowJar {}
}
// Example for how to get properties into the manifest for reading by the runtime..
jar {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                "Specification-Title"     : "aprandomizer",
                "Specification-Vendor"    : "aprandomizersareus",
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "aprandomizer",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish task
// This is the preferred method to reobfuscate your jar file
jar.finalizedBy('reobfJar')
// However if you are in a multi-project build, dev time needs unobfed jar files, so you can delay the obfuscation until publishing by doing
//publish.dependsOn('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
repositories {
    mavenCentral()
}

// Task to convert .apmcdig files before running server
task convertApmcdig {
    description = 'Converts .apmcdig files from apmcdighere folder to APData'

    doLast {
        def apmcdigDir = file('run/apmcdighere')
        def apDataDir = file('run/APData')

        if (!apmcdigDir.exists()) {
            println "No apmcdighere folder found, skipping conversion"
            return
        }

        // Find .apmcdig files
        def apmcdigFiles = apmcdigDir.listFiles({ it.name.endsWith('.apmcdig') } as FileFilter)
        if (!apmcdigFiles || apmcdigFiles.length == 0) {
            println "No .apmcdig files found in apmcdighere folder"
            return
        }

        // Use the most recent one
        def apmcdigFile = apmcdigFiles.sort { -it.lastModified() }.first()
        println "Converting: ${apmcdigFile.name}"

        // Create APData folder
        apDataDir.mkdirs()

        // Clean old files
        apDataDir.listFiles()?.each { f ->
            if (f.name.endsWith('.apmc') || f.name == 'archipelago.json') {
                f.delete()
                println "Removed old: ${f.name}"
            }
        }

        // Read ZIP and extract
        def zipFile = new java.util.zip.ZipFile(apmcdigFile)
        try {
            // Extract data.json and convert to base64
            def dataEntry = zipFile.getEntry('data.json')
            if (dataEntry) {
                def dataJson = zipFile.getInputStream(dataEntry).text
                def encoded = dataJson.bytes.encodeBase64().toString()

                // Parse and show info
                def slurper = new groovy.json.JsonSlurper()
                def data = slurper.parseText(dataJson)
                println "\n=== Seed Info ==="
                println "  Player: ${data.player_name}"
                println "  Seed: ${data.seed_name}"
                println "  Client Version: ${data.client_version}"
                println "  Chunk Count: ${data.chunk_count}"
                println "  Progressive Chunks: ${data.progressive_chunks}"
                println ""

                // Write .apmc file
                def baseName = apmcdigFile.name.replace('.apmcdig', '.apmc')
                def apmcFile = new File(apDataDir, baseName)
                apmcFile.text = encoded
                println "Created: ${apmcFile.path}"
            } else {
                println "ERROR: data.json not found in .apmcdig"
            }

            // Extract archipelago.json
            def archEntry = zipFile.getEntry('archipelago.json')
            if (archEntry) {
                def archJson = zipFile.getInputStream(archEntry).text
                def archFile = new File(apDataDir, 'archipelago.json')
                archFile.text = archJson
                println "Created: ${archFile.path}"

                // Show server
                def slurper = new groovy.json.JsonSlurper()
                def arch = slurper.parseText(archJson)
                if (arch.server) {
                    println "  Server: ${arch.server}"
                }
            }

            println "\nDone!"
        } finally {
            zipFile.close()
        }
    }
}

// Make runServer depend on convertApmcdig
tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn convertApmcdig
}